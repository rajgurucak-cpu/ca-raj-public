<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Awaiting approval — CA RAJ Scanner Terminal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Geist:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg-0: #0a0610;
        --bg-card: #15091f;
        --line: #2a1a3d;
        --purple: #a855f7;
        --purple-deep: #7c3aed;
        --purple-glow: #c084fc;
        --purple-dim: #4a1d6e;
        --gold: #fbbf24;
        --text-0: #f3eafc;
        --text-1: #c8b8de;
        --text-2: #8e7eaa;
        --text-3: #5e4f7a;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body {
        min-height: 100vh;
        font-family: "Geist", system-ui, sans-serif;
        background: var(--bg-0);
        color: var(--text-0);
      }
      body {
        background:
          radial-gradient(1100px 700px at 70% -10%, rgba(168, 85, 247, 0.16), transparent 60%),
          radial-gradient(900px 600px at -10% 110%, rgba(124, 58, 237, 0.18), transparent 60%),
          var(--bg-0);
        display: grid;
        place-items: center;
        padding: 32px 20px;
      }
      .card {
        max-width: 500px;
        width: 100%;
        background: linear-gradient(180deg, var(--bg-card), #0e0518);
        border: 1px solid var(--line);
        border-radius: 20px;
        padding: 44px 36px;
        box-shadow: 0 20px 80px rgba(124, 58, 237, 0.18);
        text-align: center;
      }
      .pulse {
        width: 72px; height: 72px;
        margin: 0 auto 20px;
        border-radius: 50%;
        background: radial-gradient(circle, var(--purple-glow), var(--purple-deep));
        display: grid; place-items: center;
        animation: pulse 2.4s ease-in-out infinite;
      }
      @keyframes pulse {
        0%, 100% { box-shadow: 0 0 0 0 rgba(168, 85, 247, 0.5); transform: scale(1); }
        50% { box-shadow: 0 0 0 22px rgba(168, 85, 247, 0); transform: scale(1.04); }
      }
      .pulse svg { width: 32px; height: 32px; color: #fff; }
      h1 {
        font-family: "Fraunces", serif;
        font-size: 30px;
        font-weight: 600;
        letter-spacing: -0.02em;
        line-height: 1.15;
        margin-bottom: 14px;
      }
      .lede { color: var(--text-1); font-size: 14.5px; line-height: 1.6; margin-bottom: 28px; }
      .userinfo {
        margin: 24px 0;
        padding: 16px;
        background: rgba(168, 85, 247, 0.06);
        border: 1px solid var(--purple-dim);
        border-radius: 12px;
        display: flex; align-items: center; gap: 14px; text-align: left;
      }
      .userinfo img { width: 44px; height: 44px; border-radius: 50%; background: var(--bg-0); }
      .userinfo .who { flex: 1; min-width: 0; }
      .userinfo .nm { font-weight: 600; color: var(--text-0); font-size: 14px; }
      .userinfo .em {
        font-family: "JetBrains Mono", monospace;
        font-size: 11.5px; color: var(--text-2);
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }
      .actions { display: flex; gap: 10px; justify-content: center; margin-top: 24px; }
      .btn {
        padding: 11px 18px;
        border-radius: 10px;
        font-family: "Geist", sans-serif;
        font-weight: 500;
        font-size: 13.5px;
        cursor: pointer;
        border: 1px solid var(--purple-dim);
        background: rgba(168, 85, 247, 0.08);
        color: var(--purple-glow);
        text-decoration: none;
        transition: all 0.18s ease;
      }
      .btn:hover { background: rgba(168, 85, 247, 0.14); border-color: var(--purple); color: var(--text-0); }
      .badge {
        display: inline-flex; align-items: center; gap: 6px;
        padding: 4px 10px; border-radius: 999px;
        background: rgba(251, 191, 36, 0.12);
        border: 1px solid rgba(251, 191, 36, 0.4);
        color: var(--gold);
        font-family: "JetBrains Mono", monospace;
        font-size: 10.5px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-weight: 500;
      }
      .footer {
        margin-top: 28px;
        font-size: 11px;
        color: var(--text-3);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-family: "JetBrains Mono", monospace;
      }
      .rejected h1 { color: #fca5a5; }
      .rejected .pulse { background: radial-gradient(circle, #fca5a5, #991b1b); animation: none; }
    </style>
  </head>
  <body>
    <main class="card" id="card">
      <div class="pulse" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <polyline points="12 6 12 12 15 14"></polyline>
        </svg>
      </div>
      <span class="badge" id="badge">Pending approval</span>
      <h1 id="heading" style="margin-top:14px">Hold tight, you're on the list</h1>
      <p class="lede" id="lede">
        The owner will review your request and grant access. You'll see all 31 scanners as soon as you're approved — just refresh this page.
      </p>
      <div class="userinfo" id="userinfo" style="display:none">
        <img id="upic" alt="" />
        <div class="who">
          <div class="nm" id="uname">—</div>
          <div class="em" id="uemail">—</div>
        </div>
      </div>
      <div class="actions">
        <a class="btn" href="/" onclick="location.reload(); return false;">Refresh</a>
        <a class="btn" href="/auth/logout">Sign out</a>
      </div>
      <div class="footer">CA RAJ — Scanner Terminal</div>
    </main>
    <script>
      fetch('/auth/me', { credentials: 'same-origin' })
        .then(r => r.json())
        .then(d => {
          if (!d.user) { location.href = '/login'; return; }
          if (d.user.status === 'approved') { location.href = '/'; return; }
          document.getElementById('uname').textContent = d.user.name || '';
          document.getElementById('uemail').textContent = d.user.email || '';
          if (d.user.picture) document.getElementById('upic').src = d.user.picture;
          document.getElementById('userinfo').style.display = 'flex';
          if (d.user.status === 'rejected') {
            document.getElementById('card').classList.add('rejected');
            document.getElementById('badge').textContent = 'Access denied';
            document.getElementById('heading').textContent = 'Access not granted';
            document.getElementById('lede').textContent = 'The owner has not granted access for this account. If this is a mistake, please reach out.';
          }
        })
        .catch(() => {});

      // Auto-poll status every 20s; redirect when approved
      setInterval(() => {
        fetch('/auth/me', { credentials: 'same-origin' })
          .then(r => r.json())
          .then(d => { if (d.user && d.user.status === 'approved') location.href = '/'; });
      }, 20000);
    </script>
  </body>
</html>
